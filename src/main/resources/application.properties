spring.application.name=Notification-Management

# Server Configuration
server.port=8084

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Service URLs
services.patient.base-url=http://localhost:8081
services.doctor.base-url=http://localhost:8082
services.appointment.base-url=http://localhost:8083

# Logging
logging.level.com.Notify.Notification_Management=DEBUG
