spring.application.name=Notification-Management

# Server Configuration
server.port=8084

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/HealthCare
spring.data.mongodb.database=HealthCare

# Service URLs
services.patient.base-url=http://localhost:8081
services.doctor.base-url=http://localhost:8082
services.appointment.base-url=http://localhost:8080

# Logging
logging.level.com.Notify.Notification_Management=DEBUG
