version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: notification-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: HealthCare
    volumes:
      - mongodb_data:/data/db
    networks:
      - notification-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      # MongoDB connection (using service name as host)
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/HealthCare
      SPRING_DATA_MONGODB_DATABASE: HealthCare
      
      # Server port
      SERVER_PORT: 8084
      
      # Other service URLs would need to be updated based on your setup
      # For now keeping localhost - update these if other services are also dockerized
      SERVICES_PATIENT_BASE_URL: http://host.docker.internal:8081
      SERVICES_DOCTOR_BASE_URL: http://host.docker.internal:8082
      SERVICES_APPOINTMENT_BASE_URL: http://host.docker.internal:8080
    depends_on:
      - mongodb
    networks:
      - notification-network

volumes:
  mongodb_data:

networks:
  notification-network:
    driver: bridge
