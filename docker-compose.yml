version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      # MongoDB connection (cloud)
      SPRING_DATA_MONGODB_URI: mongodb+srv://dbuser:dbuser2026@test.ubtlnvl.mongodb.net/client?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000&appName=TEST
      
      # Server port
      SERVER_PORT: 8084
      
      # Other service URLs would need to be updated based on your setup
      # For now keeping localhost - update these if other services are also dockerized
      SERVICES_PATIENT_BASE_URL: http://host.docker.internal:8081
      SERVICES_DOCTOR_BASE_URL: http://host.docker.internal:8082
      SERVICES_APPOINTMENT_BASE_URL: http://host.docker.internal:8080
    networks:
      - notification-network

networks:
  notification-network:
    driver: bridge
